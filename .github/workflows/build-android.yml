name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      # NDK is declared in android/app/build.gradle.kts and otherwise re-downloaded on every run.
      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/27.0.12077973
          key: android-ndk-27.0.12077973

      - run: flutter pub get

      # Single release APK for 32/64-bit ARM phones (all real devices). x86 is
      # emulator-only, skipping it saves a full native compile and ~1/3 of the APK size.
      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm,android-arm64 --build-number=${{ github.run_number }}

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk taksh-delivery-app.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taksh-delivery-app
          path: taksh-delivery-app.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: taksh-delivery-app.apk
          generate_release_notes: true
